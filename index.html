<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Apps</title>
    <style>
        html {
            height: 100%;
        }

        body {
            font-family: calibri, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            background-color: #000007;
        }

        .center {
            width: 256px;
            height: fit-content;
            margin: 0;
            padding: 0;
            font-size: 0;
            background-image: url(/img/logo.webp);
            background-repeat: no-repeat;
        }

        .center > img {
            backdrop-filter: blur(8px) saturate(1);      
            padding: 5px 15px;
            margin: -5px -15px;                  
        }

        h2 {
            text-transform: uppercase;
            color: #1e7cd6;
            font-weight: bold;
            font-size: 40px;
            margin: 0;
            text-align: center;

        }

        .center {
            text-align: center;
        }
    </style>
</head>
<body>
    <div>
        <div class="center">
            <img src="/img/logo.webp" />
        </div>
        <h2>Apps' List</h2>
    </div>
    
</body>
</html>
